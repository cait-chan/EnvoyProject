admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # Header-based routing: requests with X-Canary: true go to canary cluster
                        - match:
                            prefix: "/users"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_users_service
                        - match:
                            prefix: "/users"
                          route:
                            cluster: users_service
                        - match:
                            prefix: "/orders"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_orders_service
                        - match:
                            prefix: "/orders"
                          route:
                            cluster: orders_service
                        - match:
                            prefix: "/products"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_products_service
                        - match:
                            prefix: "/products"
                          route:
                            cluster: products_service
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    # TCP + TLS on 10001 so browsers can open https://localhost:10001/... (HTTP/1.1 or HTTP/2).
    # UDP 10001 below is QUIC/HTTP/3 only — it does not accept TCP, which caused "connection refused".
    - name: https_tcp_listener
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 10001
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/server.crt
                    private_key:
                      filename: /etc/envoy/certs/server.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                http2_protocol_options: {}
                route_config:
                  name: local_routes_https_10001
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      response_headers_to_add:
                        - header:
                            key: alt-svc
                            value: h3=":10001"; ma=86400
                      routes:
                        - match:
                            prefix: "/users"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_users_service
                        - match:
                            prefix: "/users"
                          route:
                            cluster: users_service
                        - match:
                            prefix: "/orders"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_orders_service
                        - match:
                            prefix: "/orders"
                          route:
                            cluster: orders_service
                        - match:
                            prefix: "/products"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_products_service
                        - match:
                            prefix: "/products"
                          route:
                            cluster: products_service
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: http3_listener
      address:
        socket_address:
          protocol: UDP
          address: 0.0.0.0
          port_value: 10001
      udp_listener_config:
        quic_options: {}
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.quic
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.quic.v3.QuicDownstreamTransport
              downstream_tls_context:
                common_tls_context:
                  tls_certificates:
                    - certificate_chain:
                        filename: /etc/envoy/certs/server.crt
                      private_key:
                        filename: /etc/envoy/certs/server.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP3
                stat_prefix: ingress_http_h3
                route_config:
                  name: local_routes
                  virtual_hosts:
                    # Copy the same virtual_hosts / routes as main_listener (backend + canary rules)
                    - name: backend
                      domains: ["*"]
                      routes:
                        # Header-based routing: requests with X-Canary: true go to canary cluster
                        - match:
                            prefix: "/users"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_users_service
                        - match:
                            prefix: "/users"
                          route:
                            cluster: users_service
                        - match:
                            prefix: "/orders"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_orders_service
                        - match:
                            prefix: "/orders"
                          route:
                            cluster: orders_service
                        - match:
                            prefix: "/products"
                            headers:
                              - name: x-canary
                                string_match:
                                  exact: "true"
                          route:
                            cluster: canary_products_service
                        - match:
                            prefix: "/products"
                          route:
                            cluster: products_service
                http3_protocol_options: {}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: users_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: users_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 3001
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: host.docker.internal
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
              tls_maximum_protocol_version: TLSv1_3
            validation_context:
              trusted_ca:
                filename: /etc/envoy/certs/upstream-ca.crt
    - name: canary_users_service
      connect_timeout: 5s
